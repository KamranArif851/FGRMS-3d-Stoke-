# GENERAL STOKES INPUT: edit this file, save, then double-click run.bat.
# Distances: km. Velocity scale: cm/year. Viscosity: Pa s. Pressure: Pa.
lengths_km = 600 400 200

# Choose ONE active mesh description: elements or nodes.
mesh_input = nodes
# Used only when mesh_input = elements:
elements = 4 4 3
# Used only when mesh_input = nodes (counts along x,y,z, NOT a total):
velocity_nodes = 9 9 9
# Velocity degree p: 2, 3 or 4. Pressure degree is p-1.
# Each direction must satisfy velocity_nodes = p*elements + 1.
velocity_degree = 4

# Outer FGMRES: stops when true relative residual <= tolerance,
# or fails explicitly if the maximum iteration count is reached.
relative_tolerance = 1e-10
max_iterations = 250
restart = 30

# Inner approximate block solves (advanced; defaults recommended):
velocity_inner_tolerance = 1e-2
velocity_inner_iterations = 12
pressure_inner_tolerance = 1e-3
pressure_inner_iterations = 60

# Exact solution choice: trigonometric or polynomial.
# This executable verifies manufactured solutions; keep mode manufactured.
mode = manufactured
benchmark = trigonometric
viscosity_model = linear
eta0_Pa_s = 1e21
velocity_scale_cm_year = 1
pressure_mean_Pa = 2000000
eta_min_Pa_s = 1e18
eta_max_Pa_s = 1e25
grad_div = 0

# Gauss points PER direction (maximum 10):
# quadrature >= velocity_degree+1; error_quadrature >= velocity_degree+2.
quadrature = 8
error_quadrature = 10
# Safety limit on algebraic unknowns, not a request for a node count.
# This may be raised up to 100000 if your machine has enough memory.
max_equations = 14000

# Exact and noslip both match these benchmark walls (velocity is zero).
# Other wall types need a new matching analytical solution and are rejected.
x_min = exact
x_max = exact
y_min = exact
y_max = exact
z_min = exact
z_max = exact
