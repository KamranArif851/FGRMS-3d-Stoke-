# Edit these inputs, then run run.ps1 or run.bat.
# Lengths in km; elements are counts per direction, not node counts.
lengths_km = 600 400 200
elements = 2 2 2
mode = manufactured
viscosity_model = linear
eta0_Pa_s = 1e21
velocity_scale_cm_year = 1
pressure_mean_Pa = 2000000
grad_div = 0
quadrature = 8
error_quadrature = 10
max_equations = 14000
# Physical material inputs used in gravity/custom modes.
density_kg_m3 = 3300
density_anomaly_kg_m3 = 80
gravity_m_s2 = 0 9.80665 0
inclusion_center = 0.5 0.45 0.5
inclusion_width = 0.12
viscosity_contrast = 10
averaging = arithmetic
eta_min_Pa_s = 1e18
eta_max_Pa_s = 1e25
# Face order: x_min, x_max, y_min, y_max, z_min, z_max.
# Allowed: exact, noslip, free_slip, velocity vx vy vz, traction tx ty tz.
# Velocity values: cm/year; traction: Pa; velocity nan leaves a component free.
x_min = exact
x_max = exact
y_min = exact
y_max = exact
z_min = exact
z_max = exact

velocity_degree = 4
benchmark = trigonometric


